<body>
  <div class="control-layout">

    <header class="header-bar">
      <a class="back-btn" href="/">← Back</a>

      <h1>🎛️ Control Room</h1>

      <!-- NEW -->
      <button
        id="reportRoadBlockBtn"
        class="road-block-btn"
        type="button"
      >
        🚧 Report Road Block
      </button>
    </header>

    <div class="control-body">

      <aside class="sidebar">

        <section class="sidebar-section">
          <h2>📋 Requests</h2>
          <div id="requestsList">
            <p class="empty">Loading requests…</p>
          </div>
        </section>

        <section class="sidebar-section">
          <h2>🚁 Resources</h2>
          <div id="resourcesList">
            <p class="empty">No resources yet.</p>
          </div>
        </section>

      </aside>

      <div class="map-pane">

        <div id="map"></div>

        <div id="recommendationPanel"></div>

        <!-- NEW REPLAN PANEL -->
        <div id="replanPanel"></div>

      </div>
    </div>
  </div>

  <div id="toast" class="toast" role="status"></div>

  <script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
    crossorigin=""
  ></script>

  <script>

    /* =========================================================
       MAP INITIALIZATION
    ========================================================= */

    const map = L.map("map").setView([20.2961, 85.8245], 12);

    L.tileLayer(
      "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
      {
        maxZoom: 19,
        attribution: "&copy; OpenStreetMap contributors",
      }
    ).addTo(map);


    /* =========================================================
       MARKER STORAGE
    ========================================================= */

    const markers = {
      requests: {},
      resources: {},
      roadBlocks: {}
    };


    /* =========================================================
       HELPERS
    ========================================================= */

    function field(obj, keys, fallback = "—") {
      for (const key of keys) {
        if (
          obj[key] !== undefined &&
          obj[key] !== null &&
          obj[key] !== ""
        ) {
          return obj[key];
        }
      }

      return fallback;
    }


    function coords(item) {
      const lat = Number(
        field(item, ["lat", "latitude"], NaN)
      );

      const lng = Number(
        field(item, ["lng", "lon", "longitude"], NaN)
      );

      if (
        Number.isFinite(lat) &&
        Number.isFinite(lng)
      ) {
        return [lat, lng];
      }

      return null;
    }


    function itemId(item, keys) {
      const id = field(item, keys, "");

      return id === "—" || id === ""
        ? ""
        : String(id);
    }


    function escapeHtml(value) {
      return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }


    /* =========================================================
       TOAST
    ========================================================= */

    let toastTimer = null;

    function showToast(message) {
      const toast =
        document.getElementById("toast");

      toast.textContent = message;
      toast.style.display = "block";

      clearTimeout(toastTimer);

      toastTimer = setTimeout(() => {
        toast.style.display = "none";
      }, 2800);
    }


    /* =========================================================
       ROAD BLOCK MARKERS
    ========================================================= */

    function createRoadBlockIcon() {

      return L.divIcon({
        className: "road-block-marker",

        html: `
          <div style="
            width:28px;
            height:28px;
            border-radius:50%;
            background:#dc2626;
            color:white;
            display:flex;
            align-items:center;
            justify-content:center;
            font-size:22px;
            font-weight:900;
            border:3px solid white;
            box-shadow:0 2px 8px rgba(0,0,0,0.45);
          ">×</div>
        `,

        iconSize: [28, 28],
        iconAnchor: [14, 14]
      });
    }


    function upsertRoadBlockMarker(block) {

      const id =
        itemId(block, [
          "id",
          "road_block_id",
          "block_id"
        ]) ||
        `${block.lat}_${block.lng}`;

      const pos = coords(block);

      if (!pos) return;

      const description =
        field(
          block,
          ["description", "reason", "details"],
          "Road blocked"
        );

      const popup = `
        <strong>🚧 Road Block</strong><br>
        Location: ${pos[0].toFixed(5)},
        ${pos[1].toFixed(5)}<br>
        Description: ${escapeHtml(description)}
      `;

      const existing =
        markers.roadBlocks[id];

      if (existing) {

        existing.setLatLng(pos);
        existing.setPopupContent(popup);

        return;
      }

      const marker = L.marker(pos, {
        icon: createRoadBlockIcon()
      }).addTo(map);

      marker.bindPopup(popup);

      markers.roadBlocks[id] = marker;
    }


    function pruneRoadBlockMarkers(seenIds) {

      Object.keys(markers.roadBlocks)
        .forEach((id) => {

          if (!seenIds.has(id)) {

            map.removeLayer(
              markers.roadBlocks[id]
            );

            delete markers.roadBlocks[id];
          }
        });
    }


    /* =========================================================
       ROAD BLOCK API
    ========================================================= */

    async function pollRoadBlocks() {

      try {

        const res =
          await fetch("/api/road-blocks");

        if (!res.ok) {
          throw new Error(
            "Failed to load road blocks"
          );
        }

        const data =
          await res.json();

        const blocks =
          Array.isArray(data)
            ? data
            : (
                data.road_blocks ||
                data.roadBlocks ||
                data.blocks ||
                []
              );

        const seenIds = new Set();

        blocks.forEach((block) => {

          const id =
            itemId(block, [
              "id",
              "road_block_id",
              "block_id"
            ]) ||
            `${block.lat}_${block.lng}`;

          seenIds.add(id);

          upsertRoadBlockMarker(block);
        });

        pruneRoadBlockMarkers(seenIds);

      } catch (err) {

        console.error(
          "Road block polling error:",
          err
        );
      }
    }


    /* =========================================================
       REPORT ROAD BLOCK
    ========================================================= */

    async function reportRoadBlock() {

      /*
       * First option:
       * Ask user for coordinates.
       */

      const useMapClick =
        confirm(
          "Report a road block:\n\n" +
          "Press OK to select the location on the map.\n" +
          "Press Cancel to enter latitude/longitude manually."
        );


      let lat;
      let lng;


      if (useMapClick) {

        showToast(
          "📍 Click the blocked location on the map"
        );

        try {

          const clicked =
            await waitForMapClick();

          lat = clicked.lat;
          lng = clicked.lng;

        } catch (err) {

          showToast(
            "Map selection cancelled"
          );

          return;
        }

      } else {

        lat = Number(
          prompt("Enter latitude:")
        );

        lng = Number(
          prompt("Enter longitude:")
        );

        if (
          !Number.isFinite(lat) ||
          !Number.isFinite(lng)
        ) {

          alert(
            "Invalid latitude or longitude."
          );

          return;
        }
      }


      const description =
        prompt(
          "Describe the road block:",
          "Road blocked"
        );


      if (description === null) {
        return;
      }


      /*
       * Send to backend
       */

      try {

        showToast(
          "🚧 Reporting road block..."
        );

        const res =
          await fetch(
            "/api/road-block",
            {
              method: "POST",

              headers: {
                "Content-Type":
                  "application/json"
              },

              body: JSON.stringify({
                lat,
                lng,
                description
              })
            }
          );


        if (!res.ok) {

          const errorText =
            await res.text();

          throw new Error(
            errorText ||
            "Failed to report road block"
          );
        }


        const data =
          await res.json();


        /*
         * Immediately show marker
         */

        if (data.road_block) {

          upsertRoadBlockMarker(
            data.road_block
          );

        } else {

          upsertRoadBlockMarker({
            id: Date.now(),
            lat,
            lng,
            description
          });
        }


        showToast(
          "🚧 Road block reported"
        );


        /*
         * Backend may return:
         *
         * {
         *   replan: {...}
         * }
         *
         * or
         *
         * {
         *   replan_suggestion: {...}
         * }
         */

        const replan =
          data.replan ||
          data.replan_suggestion ||
          data.replanSuggestion;


        if (replan) {

          showReplanPanel(
            replan,
            {
              lat,
              lng,
              description
            }
          );

        }

      } catch (err) {

        console.error(err);

        showToast(
          "❌ " + err.message
        );
      }
    }


    /*
     * Wait for one map click.
     */

    function waitForMapClick() {

      return new Promise(
        (resolve, reject) => {

          const handler =
            function (event) {

              map.off(
                "click",
                handler
              );

              resolve({
                lat:
                  event.latlng.lat,
                lng:
                  event.latlng.lng
              });
            };


          map.once(
            "click",
            handler
          );


          /*
           * Allow ESC to cancel.
           */

          const keyHandler =
            function (event) {

              if (event.key === "Escape") {

                map.off(
                  "click",
                  handler
                );

                document.removeEventListener(
                  "keydown",
                  keyHandler
                );

                reject(
                  new Error(
                    "cancelled"
                  )
                );
              }
            };


          document.addEventListener(
            "keydown",
            keyHandler
          );
        }
      );
    }


    /* =========================================================
       REPLAN STATE
    ========================================================= */

    const replanState = {
      data: null,
      roadBlock: null
    };


    function hideReplanPanel() {

      const panel =
        document.getElementById(
          "replanPanel"
        );

      panel.style.display = "none";
      panel.innerHTML = "";

      replanState.data = null;
      replanState.roadBlock = null;
    }


    /*
     * Convert plan data into readable text.
     *
     * Supports:
     * - string
     * - array
     * - object
     */

    function formatPlan(plan) {

      if (
        plan === null ||
        plan === undefined
      ) {
        return "No plan available";
      }


      if (typeof plan === "string") {
        return escapeHtml(plan);
      }


      if (Array.isArray(plan)) {

        return plan
          .map(
            (item, index) =>
              `${index + 1}. ${
                typeof item === "object"
                  ? JSON.stringify(
                      item,
                      null,
                      2
                    )
                  : item
              }`
          )
          .join("\n");
      }


      if (typeof plan === "object") {

        /*
         * If backend sends a list of assignments,
         * make it easier to read.
         */

        return Object.entries(plan)
          .map(
            ([key, value]) =>
              `${key}: ${
                typeof value === "object"
                  ? JSON.stringify(
                      value,
                      null,
                      2
                    )
                  : value
              }`
          )
          .join("\n");
      }


      return String(plan);
    }


    function getAffectedRequests(replan) {

      const affected =
        replan.affected_requests ??
        replan.affectedRequests ??
        replan.affected_request_count ??
        replan.affectedRequestCount ??
        0;


      if (Array.isArray(affected)) {

        return String(
          affected.length
        );
      }

      return String(affected);
    }


    function getDelay(replan) {

      return field(
        replan,
        [
          "delay",
          "delay_minutes",
          "delayMinutes",
          "estimated_delay"
        ],
        "—"
      );
    }


    function showReplanPanel(
      replan,
      roadBlock
    ) {

      replanState.data = replan;
      replanState.roadBlock =
        roadBlock;


      const panel =
        document.getElementById(
          "replanPanel"
        );


      /*
       * Backend can use either:
       *
       * old_plan / new_plan
       *
       * or:
       *
       * oldPlan / newPlan
       */

      const oldPlan =
        replan.old_plan ??
        replan.oldPlan ??
        replan.previous_plan ??
        replan.previousPlan ??
        "Current plan";


      const newPlan =
        replan.new_plan ??
        replan.newPlan ??
        replan.proposed_plan ??
        replan.proposedPlan ??
        "New plan";


      const explanation =
        field(
          replan,
          [
            "explanation",
            "reason",
            "description"
          ],
          "The system generated a new plan to avoid the reported road block."
        );


      const delay =
        getDelay(replan);


      const affected =
        getAffectedRequests(
          replan
        );


      panel.style.display =
        "block";


      panel.innerHTML = `

        <div class="replan-header">

          <h3>
            🔄 Replan Suggestion
          </h3>

          <div class="replan-trigger">
            Trigger: Road blocked
          </div>

        </div>


        <div class="plan-container">

          <div class="plan-box">

            <h4>
              Old Plan
            </h4>

            <div class="plan-content">
              ${escapeHtml(

    function priorityColor(priority) {

      const score =
        Number(priority);

      if (score > 8) return "red";
      if (score > 6) return "orange";
      if (score > 4) return "yellow";

      return "green";
    }


    function statusColor(status) {

      const value =
        String(status).toLowerCase();

      if (value === "available")
        return "green";

      if (value === "assigned")
        return "yellow";

      if (value === "busy")
        return "red";

      return "gray";
    }


    function resourceIcon(color) {

      return L.divIcon({

        className:
          "resource-marker",

        html: `
          <span style="
            display:block;
            width:16px;
            height:16px;
            border-radius:50%;
            background:${color};
            border:2px solid #fff;
            box-shadow:0 0 0 1px ${color};
          "></span>
        `,

        iconSize: [16, 16],

        iconAnchor: [8, 8]
      });
    }


    function pruneMarkers(
      dict,
      seenIds
    ) {

      Object.keys(dict)
        .forEach((id) => {

          if (!seenIds.has(id)) {

            map.removeLayer(
              dict[id]
            );

            delete dict[id];
          }
        });
    }


    function asPercent(score) {

      const n =
        Number(score);

      if (!Number.isFinite(n))
        return 0;

      return Math.max(
        0,
        Math.min(
          100,
          n <= 1
            ? n * 100
            : n
        )
      );
    }


    function formatScore(score) {

      const n =
        Number(score);

      if (!Number.isFinite(n))
        return "—";

      return n <= 1
        ? `${Math.round(n * 100)}%`
        : String(n);
    }


    function normalizeFactors(raw) {

      if (!raw) return [];

      if (Array.isArray(raw)) {

        return raw.map(
          (item) => ({

            factor:
              field(
                item,
                [
                  "factor",
                  "name",
                  "key"
                ]
              ),

            value:
              field(
                item,
                ["value"]
              ),

            score:
              field(
                item,
                ["score"]
              ),

            weight:
              field(
                item,
                ["weight"]
              )

          })
        );
      }


      return Object.entries(raw)
        .map(
          ([factor, item]) => {

            const details =
              item &&
              typeof item === "object"
                ? item
                : {
                    value: item
                  };

            return {

              factor,

              value:
                field(
                  details,
                  ["value"],
                  details.value ?? "—"
                ),

              score:
                field(
                  details,
                  ["score"]
                ),

              weight:
                field(
                  details,
                  ["weight"]
                )

            };
          }
        );
    }


    function normalizeCandidate(
      raw,
      fallback = {}
    ) {

      if (
        !raw ||
        typeof raw !== "object"
      ) {
        return null;
      }


      const resource =
        raw.resource &&
        typeof raw.resource === "object"
          ? raw.resource
          : raw;


      return {

        resource_id:
          itemId(
            resource,
            [
              "resource_id",
              "id"
            ]
          ) ||
          itemId(
            raw,
            [
              "resource_id",
              "id"
            ]
          ),

        name:
          field(
            resource,
            [
              "name",
              "resource_name"
            ],
            field(
              raw,
              [
                "name",
                "resource_name"
              ]
            )
          ),

        score:
          field(
            raw,
            [
              "match_score",
              "score"
            ],
            field(
              resource,
              [
                "match_score",
                "score"
              ]
            )
          ),

        eta:
          field(
            raw,
            [
              "eta",
              "eta_minutes"
            ],
            field(
              resource,
              [
                "eta",
                "eta_minutes"
              ]
            )
          ),

        explanation:
          field(
            raw,
            ["explanation"],
            fallback.explanation
          ),

        reason:
          field(
            raw,
            [
              "reason",
              "why"
            ],
            ""
          ),

        factors:
          normalizeFactors(
            raw.factors ||
            raw.factor_breakdown ||
            fallback.factors
          )

      };
    }


    function parseRecommendation(
      data,
      requestId
    ) {

      const payload =
        data.recommendation &&
        typeof data.recommendation === "object"
          ? data.recommendation
          : data;


      const primary =
        normalizeCandidate(
          payload.recommended ||
          payload.best ||
          payload
        );


      const alts =
        (
          payload.alternatives ||
          payload.other ||
          []
        )
          .map(
            (alt) =>
              normalizeCandidate(
                alt,
                payload
              )
          )
          .filter(Boolean);


      const candidates =
        [
          primary,
          ...alts
        ].filter(Boolean);


      return {
        requestId,
        candidates
      };
    }


    function renderFactorRows(
      factors
    ) {

      if (!factors.length) {

        return `
          <p
            class="empty"
            style="color:#64748b"
          >
            No factor breakdown.
          </p>
        `;
      }


      const rows =
        factors
          .map(
            (f) => {

              const pct =
                asPercent(
                  f.score
                );

              const weightNum =
                Number(
                  f.weight
                );

              const weightLabel =
                Number.isFinite(
                  weightNum
                )
                  ? (
                      weightNum <= 1
                        ? `${Math.round(
                            weightNum * 100
                          )}%`
                        : String(
                            weightNum
                          )
                    )
                  : escapeHtml(
                      f.weight
                    );


              return `
                <tr>

                  <td>
                    ${escapeHtml(
                      f.factor
                    )}
                  </td>

                  <td>
                    ${escapeHtml(
                      f.value
                    )}
                  </td>

                  <td>

                    <div
                      class="score-cell"
                    >

                      <div
                        class="bar"
                        aria-hidden="true"
                      >
                        <span
                          style="
                            width:${pct}%
                          "
                        ></span>
                      </div>

                      <span>
                        ${escapeHtml(
                          formatScore(
                            f.score
                          )
                        )}
                      </span>

                    </div>

                  </td>

                  <td>
                    ${weightLabel}
                  </td>

                </tr>
              `;
            }
          )
          .join("");


      return `
        <table class="factor-table">

          <thead>

            <tr>
              <th>Factor</th>
              <th>Value</th>
              <th>Score</th>
              <th>Weight</th>
            </tr>

          </thead>

          <tbody>
            ${rows}
          </tbody>

        </table>
      `;
    }

    async function getRecommendation(
      requestId
    ) {

      const panel =
        document.getElementById(
          "recommendationPanel"
        );


      recState.requestId =
        requestId;

      recState.candidates =
        [];

      recState.index = 0;


      panel.style.display =
        "block";


      panel.innerHTML = `

        <article class="rec-card">

          <header>
            <h3>
              AI suggestion
            </h3>
          </header>

          <section class="rec-section">
            <p>
              Loading recommendation…
            </p>
          </section>

        </article>
      `;


      try {

        const res =
          await fetch(
            `/api/recommend/${encodeURIComponent(
              requestId
            )}`
          );


        if (!res.ok) {

          throw new Error(
            "No recommendation available"
          );
        }


        const data =
          await res.json();


        const parsed =
          parseRecommendation(
            data,
            requestId
          );


        recState.candidates =
          parsed.candidates;

        recState.index = 0;


        renderRecommendationCard();


      } catch (err) {

        panel.innerHTML = `

          <article class="rec-card">

            <header>
              <h3>
                AI suggestion
              </h3>
            </header>

            <section class="rec-section">

              <p>
                ${escapeHtml(
                  err.message
                )}
              </p>

            </section>

          </article>
        `;
      }
    }


    async function approveRecommendation() {

      const current =
        recState.candidates[
          recState.index
        ];


      if (
        !current ||
        !recState.requestId
      ) {
        return;
      }


      const approveBtn =
        document.getElementById(
          "approveBtn"
        );

      const rejectBtn =
        document.getElementById(
          "rejectBtn"
        );


      if (approveBtn)
        approveBtn.disabled =
          true;

      if (rejectBtn)
        rejectBtn.disabled =
          true;


      try {

        const res =
          await fetch(
            "/api/assign",
            {
              method: "POST",

              headers: {
                "Content-Type":
                  "application/json"
              },

              body: JSON.stringify({

                request_id:
                  recState.requestId,

                resource_id:
                  current.resource_id,

                eta:
                  current.eta,

                score:
                  current.score,

                explanation:
                  current.explanation ||
                  current.reason ||
                  ""

              })
            }
          );


        if (!res.ok) {

          throw new Error(
            "Assignment failed"
          );
        }


        hideRecommendationPanel();


        showToast(
          "✅ Assigned"
        );


        refresh();


      } catch (err) {

        showToast(
          err.message
        );


        if (approveBtn)
          approveBtn.disabled =
            false;

        if (rejectBtn)
          rejectBtn.disabled =
            false;
      }
    }


    function rejectRecommendation() {

      if (
        recState.index + 1 <
        recState.candidates.length
      ) {

        recState.index += 1;

        renderRecommendationCard();

        return;
      }


      hideRecommendationPanel();

      showToast(
        "No more alternatives"
      );
    }

    function upsertRequestMarker(
      req
    ) {

      const id =
        itemId(
          req,
          [
            "id",
            "request_id"
          ]
        );


      const pos =
        coords(req);


      if (!id || !pos)
        return;


      const type =
        field(
          req,
          [
            "type",
            "request_type",
            "kind"
          ]
        );


      const people =
        field(
          req,
          [
            "people",
            "people_count",
            "num_people",
            "count"
          ]
        );


      const priority =
        field(
          req,
          [
            "priority_score",
            "priority",
            "score"
          ]
        );


      const vulnerability =
        field(
          req,
          [
            "vulnerability",
            "vulnerable",
            "vulnerability_score"
          ]
        );


      const color =
        priorityColor(
          priority
        );


      const popup = `
        Type: ${escapeHtml(type)}<br>
        People: ${escapeHtml(people)}<br>
        Priority: ${escapeHtml(priority)}<br>
        Vulnerability: ${escapeHtml(vulnerability)}
      `;


      const existing =
        markers.requests[id];


      if (existing) {

        existing.setLatLng(pos);

        existing.setStyle({
          color,
          fillColor: color
        });

        existing.setPopupContent(
          popup
        );

        return;
      }


      const marker =
        L.circleMarker(
          pos,
          {
            radius: 10,
            color,
            fillColor: color,
            fillOpacity: 0.75,
            weight: 2
          }
        ).addTo(map);


      marker.bindPopup(
        popup
      );


      marker.on(
        "click",
        () =>
          getRecommendation(id)
      );


      markers.requests[id] =
        marker;
    }

       RESOURCE MARKERS

    function upsertResourceMarker(
      res
    ) {

      const id =
        itemId(
          res,
          [
            "id",
            "resource_id"
          ]
        );


      const pos =
        coords(res);


      if (!id || !pos)
        return;


      const name =
        field(
          res,
          ["name"]
        );


      const type =
        field(
          res,
          [
            "type",
            "kind"
          ]
        );


      const capacity =
        field(
          res,
          ["capacity"]
        );


      const status =
        field(
          res,
          [
            "status",
            "state"
          ],
          "available"
        );


      const color =
        statusColor(
          status
        );


      const popup = `
        Name: ${escapeHtml(name)}<br>
        Type: ${escapeHtml(type)}<br>
        Capacity: ${escapeHtml(capacity)}<br>
        Status: ${escapeHtml(status)}
      `;


      const existing =
        markers.resources[id];


      if (existing) {

        existing.setLatLng(pos);

        existing.setIcon(
          resourceIcon(color)
        );

        existing.setPopupContent(
          popup
        );

        return;
      }


      const marker =
        L.marker(
          pos,
          {
            icon:
              resourceIcon(
                color
              )
          }
        ).addTo(map);


      marker.bindPopup(
        popup
      );


      markers.resources[id] =
        marker;
    }

            "/api/requests"
          );


        if (!res.ok) {

          throw new Error(
            "Failed to load requests"
          );
        }


        const data =
          await res.json();


        const requests =
          Array.isArray(data)
            ? data
            : (
                data.requests ||
                []
              );


        renderRequests(
          requests
        );


      } catch (err) {

        document
          .getElementById(
            "requestsList"
          )
          .innerHTML = `
            <p class="empty">
              ${escapeHtml(
                err.message
              )}
            </p>
          `;
      }
    }


    async function pollResources() {

      try {

        const res =
          await fetch(
            "/api/resources"
          );


        if (!res.ok)
          return;


        const data =
          await res.json();


        const resources =
          Array.isArray(data)
            ? data
            : (
                data.resources ||
                []
              );


        renderResources(
          resources
        );


      } catch (_) {

        /*
         * Resources endpoint is optional.
         */

      }
    }


    function refresh() {

      pollRequests();
      pollResources();
    }


    /* =========================================================
       EVENT HANDLERS
    ========================================================= */

    document
      .getElementById(
        "reportRoadBlockBtn"
      )
      .addEventListener(
        "click",
        reportRoadBlock
      );


    /* =========================================================
       INITIAL LOAD
    ========================================================= */

    refresh();

    /*
     * Existing requests/resources:
     * every 3 seconds
     */

    setInterval(
      refresh,
      3000
    );


    /*
     * Road blocks:
     * every 5 seconds
     */

    pollRoadBlocks();

    setInterval(
      pollRoadBlocks,
      5000
    );

  </script>
</body>
</html>
